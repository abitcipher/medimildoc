# Deploy to the VPS: build the `app` and `ihds` images, push them to the
# GitHub Container Registry, then run infra/deploy.sh in pull mode (the
# server pulls the images; nothing is compiled there).
#
# Runs by hand (Actions -> Deploy -> Run workflow) and after CI succeeds on
# main. Repository secrets it needs:
#   DEPLOY_HOST     server address (e.g. hrda.artcomplect.com)
#   DEPLOY_USER     deploy user created by infra/server/bootstrap.sh (hrda)
#   DEPLOY_SSH_KEY  that user's private SSH key
# and optionally the repository variable PHX_HOST (default
# hrda.artcomplect.com). The server's infra/.env is created on the first
# install and never touched by this workflow.
name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Image prefix (registry names must be lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: phoenix
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/app:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/app:latest
          cache-from: type=gha,scope=phoenix
          cache-to: type=gha,mode=max,scope=phoenix

      - name: Build and push ihds
        uses: docker/build-push-action@v6
        with:
          context: ihds
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ihds:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/ihds:latest
          cache-from: type=gha,scope=ihds
          cache-to: type=gha,mode=max,scope=ihds

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Let the server pull from GHCR (token valid for this run only)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy
        env:
          PULL: "1"
          PHX_HOST: ${{ vars.PHX_HOST || 'hrda.artcomplect.com' }}
        run: SSH_KEY="$HOME/.ssh/deploy_key" infra/deploy.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

      - name: Forget the registry login on the server
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" docker logout ghcr.io || true
