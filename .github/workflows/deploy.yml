# Deploy to the VPS: build the `app` and `ihds` images, push them to the
# GitHub Container Registry, then run infra/deploy.sh in pull mode (the
# server pulls the images; nothing is compiled there).
#
# Runs by hand (Actions -> Deploy -> Run workflow) and after CI succeeds on
# main. Repository secrets it needs:
#   DEPLOY_HOST     server address (e.g. hrda.artcomplect.com)
#   DEPLOY_USER     deploy user created by infra/server/bootstrap.sh (hrda)
#   DEPLOY_SSH_KEY  that user's private SSH key
# and optionally the repository variable PHX_HOST (default
# hrda.artcomplect.com). The server's infra/.env is created on the first
# install and never touched by this workflow.
name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Image prefix (registry names must be lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        uses: docker/build-push-action@v7
        with:
          context: phoenix
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/app:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/app:latest
          cache-from: type=gha,scope=phoenix
          cache-to: type=gha,mode=max,scope=phoenix

      - name: Build and push ihds
        uses: docker/build-push-action@v7
        with:
          context: ihds
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ihds:${{ env.IMAGE_TAG }},${{ env.IMAGE_PREFIX }}/ihds:latest
          cache-from: type=gha,scope=ihds
          cache-to: type=gha,mode=max,scope=ihds

      # Every malformed key (empty, public key, CRLF, one line) gives the
      # same "Load key: error in libcrypto", so check it here and say why.
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not set (repository or 'production' environment secrets)"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/deploy_key; then
            echo "::error::DEPLOY_SSH_KEY is not a private key (no BEGIN ... PRIVATE KEY line; a .pub key does not work)"
            exit 1
          fi
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY cannot be read: paste the whole key file unchanged, line breaks included; it must have no passphrase"
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -l -f ~/.ssh/deploy_key)"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Let the server pull from GHCR (token valid for this run only)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "$TARGET" docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy
        env:
          PULL: "1"
          PHX_HOST: ${{ vars.PHX_HOST || 'hrda.artcomplect.com' }}
        run: SSH_KEY="$HOME/.ssh/deploy_key" infra/deploy.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

      - name: Forget the registry login on the server
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" docker logout ghcr.io || true
