# Reverse proxy config for the hrda.artcomplect.com deploy, installed
# as-is by infra/deploy.sh as /etc/nginx/sites-available/hrda.artcomplect.com
# (symlinked into sites-enabled). The certificate is issued by certbot
# (`certbot certonly --nginx --cert-name hrda.artcomplect.com`) and
# renewed by certbot's own timer.
#
# Every proxy_set_header below matters and is not optional boilerplate —
# each one maps directly to a real failure mode found and confirmed live
# while testing this same app through a different (non-Nginx) reverse
# proxy
#
#   - Host / X-Forwarded-For / X-Forwarded-Proto: without these,
#     config/prod.exs's `force_ssl: [rewrite_on: [:x_forwarded_proto]]`
#     can't tell the request was actually secure, and every request
#     (including every LiveView WebSocket join) gets redirected to the
#     wrong place instead of served. This is also what makes the session
#     cookie's `SameSite=None` (required for the Apps Script sidebar's
#     embedded /sheets route, itself third-party inside Google's own
#     iframe) get the `Secure` attribute it needs — Plug infers that from
#     the same rewritten scheme.
#   - Upgrade / Connection "upgrade": Phoenix LiveView is a
#     WebSocket, and unlike Caddy's `reverse_proxy` (which passes
#     WebSocket upgrades through automatically), Nginx does not unless
#     told to explicitly — an earlier draft of this config had
#     `proxy_set_header Connection "";` here, which *actively disables*
#     the upgrade handshake. Confirmed live: this doesn't fail outright
#     (the app has a long-poll fallback), but it silently downgrades
#     every LiveView on the whole app to a slower, degraded transport.
#   - proxy_read_timeout / proxy_send_timeout: a LiveView socket is meant
#     to stay open indefinitely; a too-short timeout would periodically
#     kill idle connections (including an idle-but-open Sheets sidebar).
#     LiveView's own ~30s heartbeat keeps a healthy connection from ever
#     actually going idle, so anything from a few hundred seconds up is
#     fine in practice.

upstream hrda_artcomplect {
    # The Phoenix release from infra/docker-compose.yml, mapped to this
    # port on loopback only (127.0.0.1:5085 -> the container's own :4000)
    # — never exposed directly to the internet.
    server 127.0.0.1:5085;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name hrda.artcomplect.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hrda.artcomplect.com;

    ssl_certificate /etc/letsencrypt/live/hrda.artcomplect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrda.artcomplect.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://hrda_artcomplect;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 500s;
        proxy_connect_timeout 500s;
        proxy_send_timeout 500s;
    }

    # Stored files (docs/design/reference-data-and-files.md §4): the app
    # hands out short-lived signed links to https://<host>/hrda-files/<key>
    # (the path is the bucket name), and browsers download them straight
    # from RustFS (infra/docker-compose.yml, loopback :9100).
    #   - Host must stay the public host: it is part of the signature.
    #   - Only GET/HEAD: nothing can be written to storage through here,
    #     even with a leaked key.
    #   - nosniff: files are served from the app's own domain; the app
    #     forces a validated content type on every link, and browsers must
    #     not guess another one.
    location /hrda-files/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
