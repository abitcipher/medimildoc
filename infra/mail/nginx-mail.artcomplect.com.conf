# Host Nginx site for the Stalwart web admin (infra/README.md → Mail).
# Installed as /etc/nginx/sites-available/mail.artcomplect.com; certbot
# --nginx adds the HTTPS server block and the redirect to it.
server {
    listen 80;
    listen [::]:80;
    server_name mail.artcomplect.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: Stalwart bans by this address
        # (useXForwarded), so a client must not be able to choose it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
