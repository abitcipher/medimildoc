# Reverse proxy config for the local-dev tunnel mode.
# Same reference-template caveat as hrda.artcomplect.com.conf — the real
# config on the VPS lives inline in /etc/nginx/sites-available/default,
# keep this in sync manually.
#
# Unlike hrda.artcomplect.com (upstream = the VPS's own always-running
# Docker container), this upstream is only alive when someone's local
# `docker compose --profile tunnel up` has an active reverse SSH tunnel
# open (`infra/docker-compose.yml`'s `tunnel` service) — 127.0.0.1:5086
# on the VPS is nothing but the remote end of that tunnel, forwarded
# straight through to whatever's listening on the developer's own
# machine at port 5085. When no tunnel is open, this port has nothing
# listening on it at all.
#
# `proxy_connect_timeout 3s` (vs. the 500s used for the real prod
# upstream) is deliberate, not a typo: this endpoint exists purely for
# local dev, so "nobody's tunnel is open right now" should fail fast and
# obviously (a quick 502) rather than hang for hundreds of seconds —
# confirmed live: with the default timeout, an untunnelled request to
# this endpoint reads exactly like "server is slow", which is what
# actually prompted adding this whole local-tunnel-mode feature in the
# first place (a third-party tunnel service timing out was mistaken for
# an app bug).

upstream dev_hrda_artcomplect {
    server 127.0.0.1:5086;
    keepalive 64;
}

server {
    listen 80;
    server_name dev.hrda.artcomplect.com;

    if ($host = dev.hrda.artcomplect.com) {
        return 301 https://dev.hrda.artcomplect.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.hrda.artcomplect.com;

    ssl_certificate /etc/letsencrypt/live/artcomplect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artcomplect.com/privkey.pem;

    location / {
        proxy_pass http://dev_hrda_artcomplect;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 500s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 500s;
    }
}
